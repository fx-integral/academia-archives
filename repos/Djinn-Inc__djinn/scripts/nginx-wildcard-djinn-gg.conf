# Wildcard *.djinn.gg HTTPS router.
#
# Routes v<uid>.djinn.gg to whichever IP that UID currently reports
# to the metagraph. The mapping is generated by
# /usr/local/bin/refresh-uid-routing.sh (cron'd every minute) into
# /etc/nginx/conf.d/uid-routing-map.conf as the $validator_upstream
# variable.
#
# Validators come and go automatically — no operator action, no
# manual DNS, no manual cert work. The wildcard cert is at
# /etc/letsencrypt/wildcard-djinn-gg/ (issued via acme.sh + Namecheap
# DNS challenge).
#
# Server name "v0.djinn.gg" continues to have its own dedicated vhost
# (sites-enabled/v0.djinn.gg.conf) so the existing per-validator
# certbot-managed cert keeps working. The wildcard vhost catches
# everything that doesn't match a more specific server_name.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^v(?<uid>\d+)\.djinn\.gg$;

    ssl_certificate /etc/letsencrypt/wildcard-djinn-gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/wildcard-djinn-gg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CORS allowlist: only known Djinn origins. Echoing $http_origin
    # back to any caller would let attacker.com make authenticated
    # cross-origin calls to validator endpoints; restrict to the
    # production site, Vercel previews, IPFS gateways, and local dev.
    # This has to be set BEFORE the 502 short-circuit below so that
    # dead-UID responses also carry CORS headers — otherwise the
    # browser treats them as opaque CORS errors instead of HTTP 502s,
    # and the client can't `.catch(() => null)` past them cleanly.
    set $cors_allow "";
    if ($http_origin ~* "^https://(www\.)?djinn\.gg$") { set $cors_allow "$http_origin"; }
    if ($http_origin ~* "^https://[a-z0-9-]+\.vercel\.app$") { set $cors_allow "$http_origin"; }
    if ($http_origin ~* "^https://(www\.)?djinn\.eth\.limo$") { set $cors_allow "$http_origin"; }
    if ($http_origin ~* "^https://[a-z0-9-]+\.ipfs\.[a-z0-9.-]+$") { set $cors_allow "$http_origin"; }
    if ($http_origin ~* "^http://localhost(:[0-9]+)?$") { set $cors_allow "$http_origin"; }
    if ($http_origin ~* "^http://127\.0\.0\.1(:[0-9]+)?$") { set $cors_allow "$http_origin"; }

    # Attach CORS headers at server level with `always` so they apply
    # to every response — including the 502 we generate below for
    # dead UIDs, and nginx-synthesized error pages. Without this, a
    # browser fetching v5.djinn.gg/health (UID with ip=0.0.0.0 in
    # metagraph) gets a CORS block instead of an HTTP 502, and the
    # client can't `.catch(() => null)` past it cleanly.
    # Inside `location /` we still re-declare these because `add_header`
    # at an inner scope with any of its own `add_header`s wipes out
    # parent-scope ones.
    add_header Access-Control-Allow-Origin $cors_allow always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Validator-Hotkey, X-Validator-Signature, X-Validator-Timestamp" always;

    # Reject hostnames whose UID isn't in the current metagraph map.
    # The map sets $validator_upstream to "" by default; we 502 those
    # so the client knows the UID doesn't exist (or is currently
    # unreachable in the metagraph snapshot).
    if ($validator_upstream = "") {
        return 502 "Validator UID not in metagraph or refresh stale";
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Validator-Hotkey, X-Validator-Signature, X-Validator-Timestamp" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        # Strip any CORS headers added by the upstream validator (FastAPI
        # CORSMiddleware). If both nginx and the upstream add
        # Access-Control-Allow-Origin, the browser sees TWO values and
        # rejects the response with ERR_FAILED per the CORS spec. nginx
        # owns CORS at the edge because its allowlist is stricter
        # (restricts to djinn.gg / Vercel / IPFS / localhost) than the
        # FastAPI fallback, which can be permissive under misconfiguration.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Validator-Hotkey, X-Validator-Signature, X-Validator-Timestamp" always;

        # Use a resolver so nginx re-resolves the upstream each request
        # (the map value is an IP:port literal so this is harmless, but
        # required by some nginx versions for variables in proxy_pass).
        resolver 8.8.8.8 1.1.1.1 ipv6=off valid=60s;
        proxy_pass http://$validator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }
}

# Plain HTTP redirect to HTTPS for any wildcard hostname.
server {
    listen 80;
    listen [::]:80;
    server_name ~^v(?<uid>\d+)\.djinn\.gg$;
    return 301 https://$host$request_uri;
}

# Catch-all for any other *.djinn.gg subdomain not claimed by the
# validator regex above. Without this block, unmatched djinn.gg
# Host headers would fall through to 00-default.conf whose cert is
# proveaudit.com — showing a competitor's brand on any typo'd share
# (api.djinn.gg, attest.djinn.gg, randomxyz.djinn.gg, etc). Filed as
# HIGH in UX_FINDINGS.md 2026-04-20 16:54; phishing amplifier
# since an attacker could publish api-djinn.gg with a matching cert
# and cite "api.djinn.gg is broken, use ours instead."
#
# First-matching-regex rule: the validator regex above wins for
# v<uid>.djinn.gg (it appears earlier in this file), everything else
# lands here with our own wildcard cert and a clean 404. Note we do
# NOT use http2 on this listen because nginx errors on redefined
# protocol options for the same listener address:port.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?:.+\.)?djinn\.gg$;

    ssl_certificate /etc/letsencrypt/wildcard-djinn-gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/wildcard-djinn-gg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 404;
}

# HTTP side of the same catch-all: redirect to www rather than
# 444, since the user typed a djinn.gg URL and shouldn't see a
# connection drop.
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?:.+\.)?djinn\.gg$;
    return 301 https://www.djinn.gg$request_uri;
}
