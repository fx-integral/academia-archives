[project]
name = "djinn-validator"
version = "0.1.0"
description = "Djinn Protocol Bittensor validator — manages key shares, MPC, outcome attestation, miner scoring"
requires-python = ">=3.11"
dependencies = [
    "bittensor>=8.0.0,<11",
    "async-substrate-interface>=1.5.6,<2",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "web3>=7.0.0,<8",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "structlog>=24.1,<26",
    "prometheus-client>=0.21.0,<1",
    "pynacl>=1.5.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pytest-httpx~=0.35.0",
    "pytest-cov>=4.1.0,<7",
    "coverage~=7.0.0",
    "ruff~=0.8.0",
]

[project.scripts]
djinn-validator = "djinn_validator.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N806: uppercase locals (used for module-scoped constants in function scope)
# N811: constant imported as non-constant (e.g., `from x import VERSION as version`)
# N812: lowercase imported as non-lowercase (e.g., `__version__ as API_VERSION`)
# N814: camelCase imported as constant
# N818: exception name without "Error" suffix (Pythonic e.g. ShareConflict)
# All N-rules above flag intentional, documented naming choices.
ignore = ["E501", "E402", "N806", "N811", "N812", "N814", "N818"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
]
