name: Build TLSNotary Tools

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload assets to (e.g. v790)"
        required: true
        default: "v790"

concurrency:
  group: build-tlsn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: djinn-tlsn-tools-linux-x86_64.tar.gz
          - os: macos-14  # Apple Silicon M1
            target: aarch64-apple-darwin
            artifact: djinn-tlsn-tools-macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tlsn-tools

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-20 snapshot)
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tlsn-tools/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('tlsn-tools/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/djinn-tlsn-prover dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/djinn-tlsn-verifier dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/djinn-tlsn-notary dist/ 2>/dev/null || true
          cd dist
          tar czf ../${{ matrix.artifact }} djinn-tlsn-*
          cd ..
          # sha256sum on Linux, shasum on macOS
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi
          echo "Built: $(ls -la ${{ matrix.artifact }})"
          cat ${{ matrix.artifact }}.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          # Upload artifact (skip if already exists for this platform)
          gh release upload ${{ github.event.inputs.release_tag }} \
            tlsn-tools/${{ matrix.artifact }} \
            --clobber || echo "Upload failed, asset may already exist"
